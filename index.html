<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calculator</title>
  <!-- CSS LINK -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <div class="screen">
      <div id="display">0</div>
    </div>

    <!-- Har button ke onclick me us function ka naam hai jo click par chalega -->
    <div class="buttons">
      <button onclick="pressClear()">AC</button>
      <button onclick="pressDelete()">⌫</button>
      <button onclick="pressPercent()">%</button>
      <button class="op" onclick="pressOperator('÷')">÷</button>

      <button class="num" onclick="pressNumber('7')">7</button>
      <button class="num" onclick="pressNumber('8')">8</button>
      <button class="num" onclick="pressNumber('9')">9</button>
      <button class="op" onclick="pressOperator('×')">×</button>

      <button class="num" onclick="pressNumber('4')">4</button>
      <button class="num" onclick="pressNumber('5')">5</button>
      <button class="num" onclick="pressNumber('6')">6</button>
      <button class="op" onclick="pressOperator('−')">−</button>

      <button class="num" onclick="pressNumber('1')">1</button>
      <button class="num" onclick="pressNumber('2')">2</button>
      <button class="num" onclick="pressNumber('3')">3</button>
      <button class="op" onclick="pressOperator('+')">+</button>

      <button class="num zero" onclick="pressNumber('0')">0</button>
      <button class="num" onclick="pressNumber('.')">.</button>
      <button class="equals" onclick="pressEquals()">=</button>
    </div>
  </div>

  <!-- JS file yahan jurti hai (body ke sab se neeche) -->
  <script src="script.js"></script>
</body>
</html>
